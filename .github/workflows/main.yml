name: Publish Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          AC43B4: ${{ secrets.AC43B4 }}
          B0ACB5: ${{ secrets.B0ACB5 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AC43B4', '')
          k2 = os.environ.get('B0ACB5', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- 6fab98c783efdc5c4cf2f1929f212aca -->', k1) if k1 else txt
          out = out.replace('<!-- 087c1e874ed90ae2666fc6 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
