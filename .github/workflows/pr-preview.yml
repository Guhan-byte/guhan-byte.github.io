# Publishes each pull request to https://robbytee.github.io/pr-preview/pr-<number>/
# and comments the link on the PR. The preview is removed when the PR closes.
# A PR that only touches one template (templates/<name>/, ignoring .github/) is
# published to https://robbytee.github.io/templates/<name>/pr-preview/pr-<number>/ instead.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick preview location
        id: target
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -v '^\.github/' || true)
          templates=$(printf '%s\n' "$changed" | sed -n 's#^templates/\([^/]*\)/.*#\1#p' | sort -u)
          others=$(printf '%s\n' "$changed" | grep -v '^templates/[^/]*/' | grep -v '^$' || true)
          if [ -n "$templates" ] && [ "$(printf '%s\n' "$templates" | wc -l)" -eq 1 ] && [ -z "$others" ]; then
            echo "source=templates/$templates" >> "$GITHUB_OUTPUT"
            echo "umbrella=templates/$templates/pr-preview" >> "$GITHUB_OUTPUT"
          else
            echo "source=." >> "$GITHUB_OUTPUT"
            echo "umbrella=pr-preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect site files
        if: github.event.action != 'closed'
        env:
          SOURCE: ${{ steps.target.outputs.source }}
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site --exclude 'pr-preview/' "$SOURCE"/ _site/

      - name: Publish or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: ${{ steps.target.outputs.umbrella }}
          # user site: served from the domain root, not /<repo>/
          pages-base-url: robbytee.github.io
